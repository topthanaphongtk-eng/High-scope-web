mes:
  wsdl_url: "http://mth-vm-asoprd/wbservice/RecordService.asmx?WSDL"
  timeout_seconds: 5
  wsdl_cache_dir: "./logs/wsdl_cache"
  # Set to false on networks where a corporate firewall intercepts HTTPS
  # and breaks cert validation for external schema imports (schemas.xmlsoap.org).
  verify_ssl: false

capture:
  watch_root: "D:/Auto save"
  recursive: true
  file_patterns: ["*.tif", "*.tiff"]
  stable_poll_ms: 200
  stable_required_checks: 2

storage:
  shared_root: "//SERVER/qc-images"
  compute_sha256: true

postgres:
  # Central PostgreSQL the stations + web monitor all share.
  host: ""                 # e.g. MTH-dk-b12416
  port: 5432
  database: highscope
  user: highscope
  password: ""             # set per machine; keep out of version control
  sslmode: prefer          # disable | prefer | require | verify-ca | verify-full

app:
  log_dir: "./logs"
  log_level: "INFO"
